<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Entropy Comparison Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 2rem 3rem;
            background: linear-gradient(to right, #1e293b, #0f172a);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 2rem;
            padding: 2rem 3rem;
        }

        .sidebar {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .main-content {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        select {
            background: #1e293b;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        .method-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .method-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid transparent;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .method-item:hover {
            border-color: var(--border-color);
            background: rgba(15, 23, 42, 0.8);
        }

        .method-item.active {
            background: rgba(56, 189, 248, 0.1);
            border-color: var(--accent-color);
        }

        .checkbox-custom {
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid var(--border-color);
            border-radius: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .method-item.active .checkbox-custom {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .chart-container {
            flex: 1;
            position: relative;
            min-height: 400px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent-color);
        }

        footer {
            padding: 1.5rem 3rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <header>
        <h1>Network Entropy Analyzer</h1>
        <div id="status" style="font-size: 0.875rem; color: var(--text-secondary);">
            Ready
        </div>
    </header>

    <div class="container">
        <aside class="sidebar">
            <div class="control-group">
                <label for="dataset-select">Dataset</label>
                <select id="dataset-select">
                    <option value="Karate">Karate Club</option>
                    <option value="Football">American Football</option>
                    <option value="Jazz">Jazz Musicians</option>
                    <option value="Tokyo City">Tokyo City Grid</option>
                </select>
            </div>

            <div class="control-group">
                <label for="mode-select">Analysis Mode</label>
                <select id="mode-select">
                    <option value="Static">Static (Pre-calculated Ranks)</option>
                    <option value="Iterative">Iterative (Recalculated Ranks)</option>
                    <option value="Comparative">Comparative (Static vs Iterative)</option>
                </select>
            </div>

            <div class="control-group">
                <label>Entropy Methods</label>
                <div class="method-list" id="method-list">
                    <!-- Methods will be populated here -->
                </div>
            </div>
            
            <button id="reset-btn" style="padding: 0.75rem; margin-top: auto; background: transparent; border: 1px solid var(--border-color); border-radius: 0.5rem; color: var(--text-primary); cursor: pointer;">Reset Selection</button>
        </aside>

        <main class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div>
                    <h2 id="chart-title">Dismantling Analysis</h2>
                    <p id="chart-desc" style="color: var(--text-secondary); font-size: 0.875rem; margin-top: 0.25rem;">
                        Relative Giant Component Size vs Fraction of Edges Removed
                    </p>
                </div>
                <div id="auc-summary" class="stat-value" style="font-size: 0.875rem; color: var(--text-secondary);"></div>
            </div>

            <div class="chart-container">
                <canvas id="mainChart"></canvas>
            </div>

            <div class="stats-grid" id="stats-grid">
                <!-- Stats will be populated here -->
            </div>
        </main>
    </div>

    <footer>
        &copy; 2026 Network Entropy Analysis Team. All rights reserved.
    </footer>

    <script src="dashboard_data.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
