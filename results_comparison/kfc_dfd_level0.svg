<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" width="1040" height="500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar0" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="500" fill="#ffffff"/>

  <text x="520" y="42" text-anchor="middle" font-size="23" font-weight="700" fill="#111827">Kirchhoff Flow Criticality (KFC) &#8212; Level&#8209;0 Context Diagram</text>
  <text x="520" y="66" text-anchor="middle" font-size="13" fill="#6b7280">The engine as a single process: one graph in, a ranked list of critical edges out</text>

  <!-- Central process (context diagram = one process) -->
  <rect x="390" y="185" width="260" height="130" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="418" cy="212" r="13" fill="#2563eb"/><text x="418" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">0</text>
  <text x="520" y="245" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">KFC Criticality Engine</text>
  <text x="520" y="270" text-anchor="middle" font-size="12" fill="#374151">Laplacian solve &#8594; current-flow &#215; effective</text>
  <text x="520" y="287" text-anchor="middle" font-size="12" fill="#374151">resistance, density-adaptive fusion</text>

  <!-- Left: input entity -->
  <rect x="40" y="205" width="200" height="90" rx="2" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
  <text x="140" y="242" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2937">Network data</text>
  <text x="140" y="263" text-anchor="middle" font-size="12" fill="#4b5563">grid GML / i,j edge list</text>
  <text x="140" y="280" text-anchor="middle" font-size="11" fill="#6b7280">(nodes = substations,</text>
  <text x="140" y="294" text-anchor="middle" font-size="11" fill="#6b7280">edges = lines)</text>

  <!-- Right top: operator / report -->
  <rect x="810" y="120" width="200" height="90" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="910" y="152" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Resilience report /</text>
  <text x="910" y="171" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">grid operator</text>
  <text x="910" y="191" text-anchor="middle" font-size="11" fill="#166534">ranked critical lines</text>

  <!-- Right bottom: N-1 / hardening plan -->
  <rect x="810" y="290" width="200" height="90" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="910" y="322" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">N&#8209;1 / hardening plan</text>
  <text x="910" y="342" text-anchor="middle" font-size="11" fill="#166534">what to protect, where to</text>
  <text x="910" y="356" text-anchor="middle" font-size="11" fill="#166534">add redundancy</text>

  <!-- Flows -->
  <g stroke="#374151" stroke-width="1.9" fill="none">
    <line x1="240" y1="250" x2="386" y2="250" marker-end="url(#ar0)"/>
    <line x1="650" y1="225" x2="806" y2="170" marker-end="url(#ar0)"/>
    <line x1="650" y1="278" x2="806" y2="330" marker-end="url(#ar0)"/>
  </g>

  <g font-size="11.5" fill="#111827" text-anchor="middle" style="paint-order:stroke" stroke="#ffffff" stroke-width="3.5" font-style="italic">
    <text x="313" y="240">graph G</text>
    <text x="735" y="185">edges ranked by criticality</text>
    <text x="735" y="322">critical edges to protect</text>
  </g>

  <!-- footnote -->
  <text x="520" y="440" text-anchor="middle" font-size="11.5" fill="#6b7280">Detail of process 0 is in the Level&#8209;1 DFD. Cost: one Laplacian solve + O(E&#183;N); ~15 ms on the 156&#8209;node Tokyo grid.</text>
</svg>
