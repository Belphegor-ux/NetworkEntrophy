<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 620" width="1360" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4 L0,8 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1360" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="680" y="38" text-anchor="middle" font-size="23" font-weight="700" fill="#111827">Kirchhoff Flow Criticality (KFC) &#8212; Level&#8209;1 Data Flow Diagram</text>
  <text x="680" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Score every edge by how critical it is to network connectivity, for resilience / N&#8209;1 protection planning</text>

  <!-- ============ SPINE (y-center 175) ============ -->
  <!-- Input entity -->
  <rect x="20" y="135" width="130" height="80" rx="2" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.6"/>
  <text x="85" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Network data</text>
  <text x="85" y="189" text-anchor="middle" font-size="12" fill="#4b5563">(graph G)</text>

  <!-- P1 -->
  <rect x="195" y="135" width="150" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <circle cx="212" cy="152" r="11" fill="#2563eb"/><text x="212" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="273" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Extract LCC</text>
  <text x="270" y="192" text-anchor="middle" font-size="11" fill="#374151">connected, no self&#8209;loops</text>

  <!-- P2 -->
  <rect x="390" y="135" width="140" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <circle cx="407" cy="152" r="11" fill="#2563eb"/><text x="407" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="463" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Laplacian</text>
  <text x="460" y="192" text-anchor="middle" font-size="12" fill="#374151">pseudoinverse L&#8314;</text>

  <!-- P3 -->
  <rect x="575" y="135" width="165" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <circle cx="592" cy="152" r="11" fill="#2563eb"/><text x="592" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
  <text x="663" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Per&#8209;edge terms</text>
  <text x="657" y="192" text-anchor="middle" font-size="11" fill="#374151">cf1 &amp; R_eff from L&#8314;</text>

  <!-- P5 -->
  <rect x="785" y="135" width="215" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <circle cx="802" cy="152" r="11" fill="#2563eb"/><text x="802" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
  <text x="895" y="172" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">KFC score</text>
  <text x="895" y="192" text-anchor="middle" font-size="12.5" fill="#374151" font-family="Consolas, monospace">cf1 &#183; (1/(1&#8722;R_eff))^&#946;</text>

  <!-- P6 -->
  <rect x="1045" y="135" width="115" height="80" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <circle cx="1062" cy="152" r="11" fill="#2563eb"/><text x="1062" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text>
  <text x="1103" y="174" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">Rank &amp; emit</text>
  <text x="1103" y="192" text-anchor="middle" font-size="11" fill="#374151">sort by KFC</text>

  <!-- Output entity -->
  <rect x="1205" y="135" width="140" height="80" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <text x="1275" y="170" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">Critical edges</text>
  <text x="1275" y="189" text-anchor="middle" font-size="11.5" fill="#166534">ranking &#8594; report</text>

  <!-- ============ DATA STORES + P4 (y-center 395) ============ -->
  <!-- DS1: L+ -->
  <rect x="385" y="363" width="150" height="60" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <line x1="419" y1="363" x2="419" y2="423" stroke="#b45309" stroke-width="1.4"/>
  <text x="402" y="397" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">D1</text>
  <text x="480" y="389" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">L&#8314; matrix</text>
  <text x="480" y="406" text-anchor="middle" font-size="11" fill="#a16207">(n &#215; n)</text>

  <!-- DS2: edge terms -->
  <rect x="560" y="363" width="180" height="60" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
  <line x1="594" y1="363" x2="594" y2="423" stroke="#b45309" stroke-width="1.4"/>
  <text x="577" y="397" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">D2</text>
  <text x="667" y="389" text-anchor="middle" font-size="12.5" font-weight="600" fill="#92400e">Edge terms</text>
  <text x="667" y="406" text-anchor="middle" font-size="11" fill="#a16207">cf1, R_eff per edge</text>

  <!-- P4: adaptive beta -->
  <rect x="770" y="359" width="215" height="68" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <circle cx="787" cy="378" r="11" fill="#7c3aed"/><text x="787" y="382" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
  <text x="881" y="382" text-anchor="middle" font-size="13.5" font-weight="600" fill="#5b21b6">mean(R_eff) &#8594; adaptive &#946;</text>
  <text x="878" y="401" text-anchor="middle" font-size="10.5" fill="#6d28d9" font-family="Consolas, monospace">&#946; = clip(1 &#8722; mean(R_eff)/0.15, 0, 1)</text>
  <text x="878" y="416" text-anchor="middle" font-size="10" fill="#7c3aed">tree&#8209;like &#8594; &#946;=0 (KFC = CFEdge) &#183; dense &#8594; &#946;&#8594;1</text>

  <!-- ============ FLOWS ============ -->
  <g stroke="#374151" stroke-width="1.7" fill="none">
    <!-- spine -->
    <line x1="150" y1="175" x2="192" y2="175" marker-end="url(#ar)"/>
    <line x1="345" y1="175" x2="387" y2="175" marker-end="url(#ar)"/>
    <line x1="530" y1="175" x2="572" y2="175" marker-end="url(#ar)"/>
    <line x1="740" y1="175" x2="782" y2="175" marker-end="url(#ar)"/>
    <line x1="1000" y1="175" x2="1042" y2="175" marker-end="url(#ar)"/>
    <line x1="1160" y1="175" x2="1202" y2="175" marker-end="url(#ar)"/>
    <!-- store writes -->
    <line x1="460" y1="215" x2="460" y2="360" marker-end="url(#ar)"/>
    <line x1="655" y1="215" x2="650" y2="360" marker-end="url(#ar)"/>
    <!-- beta path -->
    <line x1="740" y1="393" x2="767" y2="393" marker-end="url(#ar)"/>
    <line x1="878" y1="359" x2="885" y2="218" marker-end="url(#ar)"/>
  </g>

  <!-- flow labels (halo via paint-order) -->
  <g font-size="11" fill="#111827" text-anchor="middle" style="paint-order:stroke" stroke="#ffffff" stroke-width="3.5" font-style="italic">
    <text x="171" y="169">G</text>
    <text x="368" y="169">H</text>
    <text x="551" y="169">L&#8314;</text>
    <text x="762" y="169">cf1, R_eff</text>
    <text x="1021" y="169">KFC(e)</text>
    <text x="1183" y="169">i,j,KFC</text>
    <text x="472" y="300">store</text>
    <text x="620" y="300">store</text>
    <text x="753" y="384">R_eff</text>
    <text x="905" y="290">&#946;</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g font-size="12" fill="#374151">
    <rect x="20" y="470" width="1320" height="1" fill="#e5e7eb"/>
    <text x="20" y="500" font-size="12.5" font-weight="700" fill="#111827">Notation</text>
    <rect x="120" y="489" width="34" height="18" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="164" y="502">process</text>
    <rect x="245" y="489" width="34" height="18" rx="9" fill="#ede9fe" stroke="#7c3aed"/><text x="289" y="502">adaptive step</text>
    <rect x="400" y="489" width="34" height="18" rx="2" fill="#f3f4f6" stroke="#4b5563"/><text x="444" y="502">entity / data</text>
    <rect x="560" y="489" width="34" height="18" fill="#fef3c7" stroke="#b45309"/><line x1="568" y1="489" x2="568" y2="507" stroke="#b45309"/><text x="604" y="502">data store</text>
    <line x1="705" y1="498" x2="745" y2="498" stroke="#374151" stroke-width="1.7" marker-end="url(#ar)"/><text x="785" y="502">data flow</text>

    <text x="880" y="502" font-size="11.5" fill="#6b7280">Cost: one Laplacian solve + O(E&#183;N) &#183; ~15 ms on the Tokyo grid (156 nodes)</text>
  </g>
</svg>
